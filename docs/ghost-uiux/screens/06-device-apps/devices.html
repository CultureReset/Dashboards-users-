<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Devices — Ghost</title><style>
:root{

.content{padding:18px 17px 94px}.eyebrow{font-size:10px;font-weight:850;color:var(--brand);letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px}h1{font-size:29px;line-height:1.04;letter-spacing:-.045em;margin:0 0 8px}h2{font-size:20px;letter-spacing:-.03em;margin:0}h3{font-size:14px;margin:0}.lead{font-size:13.5px;line-height:1.5;color:var(--muted);margin:0 0 17px}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row.start{align-items:flex-start}.row+.row{border-top:1px solid #edf0f4;padding-top:11px;margin-top:11px}.muted{font-size:11.5px;line-height:1.45;color:var(--muted)}.small{font-size:10.5px;color:var(--muted)}

.btn{min-height:48px;border:0;border-radius:14px;padding:0 15px;font-weight:780;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--brand),#5d54ee);color:#fff;box-shadow:0 10px 25px rgba(49,94,251,.2)}.btn.secondary{background:#edf2ff;color:#294fc7}.btn.ghost{background:#fff;border:1px solid var(--line);color:#344054}.btn.danger{background:#fff0f1;color:#b4232d}.btn.sm{min-height:36px;border-radius:11px;padding:0 11px;font-size:11px}

.field{margin-bottom:12px}.field label{display:block;font-size:11.5px;font-weight:760;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid #d9e0e9;border-radius:13px;background:#fff;outline:0;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus{border-color:#8ca8ff;box-shadow:0 0 0 3px rgba(49,94,251,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:6px 8px;border-radius:999px;background:#f1f4f8;color:#475467;font-size:10.5px;font-weight:700}.chip.on{background:#e9efff;color:#3157cf}.chip.good{background:#e9f8f0;color:#08794a}.chip.warn{background:#fff2df;color:#9b5a00}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:3px;margin-bottom:13px}.tab{white-space:nowrap;padding:8px 10px;border-radius:10px;background:#f1f4f8;color:#667085;font-size:11px;font-weight:750}.tab.active{background:#172338;color:#fff}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);height:70px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);backdrop-filter:blur(14px);display:grid;grid-template-columns:repeat(5,1fr);z-index:40;padding-bottom:env(safe-area-inset-bottom)}.nav a{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;color:#98a2b3;font-size:9px;font-weight:750}.nav a.active{color:var(--brand)}.ni{font-size:16px}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:18px 0 9px}.section-title a{font-size:10.5px;color:var(--brand);font-weight:800}.metricgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:13px;border:1px solid var(--line);border-radius:15px;background:#fff}.metric small{font-size:9.5px;color:var(--muted);font-weight:750}.metric strong{display:block;font-size:22px;letter-spacing:-.04em;margin:3px 0}
.storehero{padding:17px;border-radius:20px;background:linear-gradient(145deg,#10192a,#1d2d47);color:#fff;margin-bottom:12px}.storehero h2{font-size:22px}.storehero p{color:#b7c2d2;font-size:11.5px;line-height:1.5;margin:6px 0 0}.storecard{display:flex;gap:12px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:16px;margin-bottom:8px;background:#fff}.grow{flex:1}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.badge{font-size:9.5px;font-weight:850;padding:5px 7px;border-radius:999px;background:#eef3ff;color:#3157c8;white-space:nowrap}.badge.green{background:#e9f8f0;color:#08794a}.badge.orange{background:#fff2df;color:#9b5a00}.badge.dark{background:#1c2a40;color:#d9e4f6}
.permission{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:#f8f9fb;border:1px solid #e7ebf1;margin-bottom:7px}.permission.sensitive{background:#fff5e9}.permicon{width:29px;height:29px;border-radius:9px;background:#edf2ff;display:grid;place-items:center;flex:0 0 auto}.sensitive .permicon{background:#ffe7c3}
.toggle{width:43px;height:25px;border-radius:99px;background:#d4dae4;padding:3px;cursor:pointer;flex:0 0 auto}.toggle i{display:block;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0002;transition:.2s}.toggle.on{background:var(--brand)}.toggle.on i{transform:translateX(18px)}
.timeline{position:relative;padding-left:21px}.timeline:before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:#dce3ee}.step{position:relative;padding-bottom:17px}.step:before{content:"";position:absolute;left:-19px;top:3px;width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid var(--brand)}.step.done:before{background:var(--green);border-color:var(--green)}.step strong{font-size:12.5px}.step p{font-size:10.5px;color:var(--muted);margin:3px 0 0}
.flow{display:flex;align-items:center;gap:6px;overflow:auto;padding:6px 0 12px}.flowbox{min-width:122px;padding:11px;border-radius:14px;background:#fff;border:1px solid var(--line)}.flowbox b{font-size:11.5px;display:block}.flowbox small{font-size:9.5px;color:var(--muted)}.arrow{color:#9aa7b9;font-weight:900}.diagram{display:grid;grid-template-columns:1fr 1fr;gap:8px}.diagram .card{margin:0}
.notice{border-left:3px solid var(--brand);background:#f4f7ff;border-radius:0 13px 13px 0;padding:11px 12px;font-size:11.5px;line-height:1.45;color:#40516d}.notice.warn{border-color:#e39a20;background:#fff8ea}.notice.good{border-color:var(--green);background:#effaf5}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#f8fafc;border-radius:13px;padding:10px 11px;color:#98a2b3;font-size:11.5px}.code{background:#0e1728;color:#d9e5ff;border-radius:15px;padding:12px;font:10.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
.browser{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}.browserbar{height:32px;background:#edf1f6;display:flex;align-items:center;gap:5px;padding:0 10px}.dot{width:7px;height:7px;background:#aeb7c6;border-radius:50%}.preview{padding:11px;background:#f7f8fb}.heroimg{height:175px;border-radius:18px;background:linear-gradient(145deg,#3860aa,#152846);color:#fff;padding:17px;display:flex;flex-direction:column;justify-content:flex-end}.heroimg h2{font-size:26px}.public-action{background:#fff;border:1px solid #e0e6ef;border-radius:15px;padding:14px;margin-top:9px;display:flex;justify-content:space-between;align-items:center}
.surfacephone{border:6px solid #18243a;border-radius:27px;padding:7px;background:#fff;min-height:470px}.canvasgrid{display:grid;grid-template-columns:92px 1fr;gap:9px}.block{padding:9px;border:1px dashed #cbd5e1;border-radius:11px;margin-bottom:6px;font-size:10.5px;background:#fff}.kicker{font-size:9.5px;font-weight:850;color:#98a2b3;letter-spacing:.08em;text-transform:uppercase}
.center{text-align:center}.logo-big{width:64px;height:64px;border-radius:21px;background:linear-gradient(145deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;margin:23px auto 16px;font-size:27px;box-shadow:0 20px 50px rgba(49,94,251,.25)}.table{width:100%;border-collapse:collapse}.table td{padding:10px 0;border-bottom:1px solid #edf0f4;font-size:11px}.table td:last-child{text-align:right}.table tr:last-child td{border-bottom:0}
@media(max-width:360px){.content{padding-left:13px;padding-right:13px}h1{font-size:26px}.metricgrid{grid-template-columns:1fr}}
</style></head><body><div class="stage"><div class="phone"><header class="top "><div class="brand"><span class="mark">G</span>Ghost</div><div style="font-size:11.5px;font-weight:850">Device Apps</div><a class="iconbtn" href="../03-owner-dashboard/notifications.html">⋯</a></header><main class="content"><div class="eyebrow">Device Apps</div><h1>Devices</h1><p class="lead">Cloud Android, physical Android, browser workspaces, and Ghost Nodes.</p><div class="card row"><div class="row" style="justify-content:flex-start"><div class=appicon>▣</div><div><h3>Cloud Android</h3><div class=muted>Pixel 8 · 7 apps</div></div></div><span class=badge>Online</span></div><div class="card row"><div class="row" style="justify-content:flex-start"><div class=appicon>◫</div><div><h3>Browser Workspace</h3><div class=muted>Chrome · 4 sessions</div></div></div><span class=badge>Online</span></div><div class="card row"><div class="row" style="justify-content:flex-start"><div class=appicon>⌂</div><div><h3>Ghost Node</h3><div class=muted>Local mini PC · 2 devices</div></div></div><span class=badge>Online</span></div></main><nav class="nav"><a href="../03-owner-dashboard/dashboard-home.html" class=""><span class="ni">⌂</span>Home</a><a href="../03-owner-dashboard/business-data.html" class=""><span class="ni">▦</span>Data</a><a href="../03-owner-dashboard/my-apps.html" class=""><span class="ni">◫</span>Apps</a><a href="../03-owner-dashboard/connections-home.html" class="active"><span class="ni">∞</span>Tools</a><a href="../10-settings/settings.html" class=""><span class="ni">•••</span>More</a></nav></div></div><script>
document.addEventListener('click',e=>{
 const c=e.target.closest('.choice'); if(c && !c.matches('a')){const box=c.parentElement;box.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));c.classList.add('selected')}
 const t=e.target.closest('.toggle'); if(t){t.classList.toggle('on')}
 const b=e.target.closest('[data-install]'); if(b){const k='ghost_demo_'+b.dataset.install;const on=localStorage.getItem(k)==='1';localStorage.setItem(k,on?'0':'1');b.textContent=on?'Install':'Installed ✓';b.classList.toggle('primary',!on);b.classList.toggle('secondary',on)}
});
window.addEventListener('DOMContentLoaded',()=>document.querySelectorAll('[data-install]').forEach(b=>{if(localStorage.getItem('ghost_demo_'+b.dataset.install)==='1'){b.textContent='Installed ✓';b.classList.remove('secondary');b.classList.add('primary')}}));
</script></body></html>
